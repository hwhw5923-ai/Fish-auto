name: Fish Bot Runner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: fishbot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore bot config
        uses: actions/cache/restore@v4
        with:
          path: bot_config.json
          key: botcfg-${{ github.run_id }}
          restore-keys: |
            botcfg-

      - name: Run bot
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          END=$((SECONDS + 20400))
          while [ $SECONDS -lt $END ]; do
            timeout 3600 python bot.py || true
            echo "bot.py exited, restarting in 5s..."
            sleep 5
          done

      - name: Save bot config
        if: always()
        uses: actions/cache/save@v4
        with:
          path: bot_config.json
          key: botcfg-${{ github.run_id }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.run_id }}
          path: |
            bot.log
            bot_config.json
          if-no-files-found: ignore
